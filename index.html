<!doctype html>
<html lang="pt-BR" data-theme="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Constela</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#1a1240">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8">
  <script>
    // Aplica o tema salvo antes da primeira pintura (evita "piscar" de tema).
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('rotina.tema')); } catch (e) {}
      if (!t) { var m = document.cookie.match(/(?:^|; )rotina\.tema=([^;]*)/); if (m) try { t = JSON.parse(decodeURIComponent(m[1])); } catch (e) {} }
      if (['claro', 'escuro', 'ceu', 'por-do-sol', 'noite', 'universo'].indexOf(t) >= 0) document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <!-- ============ Topo ============ -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="6" cy="7" r="2.6"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="17" r="3"/><path d="M6 7 18 6M6 7l6 10M18 6l-6 11" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Rotina</span>
    </div>

    <div class="top-actions">
      <button type="button" id="search-toggle" class="icon-btn lg" title="Pesquisar (Ctrl+K)" aria-label="Pesquisar" aria-pressed="false" aria-controls="search-bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      </button>

      <div class="popover-wrap">
        <button type="button" class="icon-btn lg" data-popover="theme-pop" title="Tema" aria-label="Escolher tema" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.6-.8 1.6-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.8-1.7 1.7-1.7H16a5 5 0 0 0 5-5C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11.5" r="1.2"/><circle cx="10.5" cy="7.5" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
        </button>
        <div class="popover" id="theme-pop" role="menu" hidden>
          <div class="popover-title">Tema</div>
          <button type="button" role="menuitemradio" data-theme-btn="claro"><i class="swatch sw-claro"></i>Claro</button>
          <button type="button" role="menuitemradio" data-theme-btn="escuro"><i class="swatch sw-escuro"></i>Escuro</button>
          <button type="button" role="menuitemradio" data-theme-btn="ceu"><i class="swatch sw-ceu"></i>Céu de dia</button>
          <button type="button" role="menuitemradio" data-theme-btn="por-do-sol"><i class="swatch sw-sol"></i>Pôr do sol</button>
          <button type="button" role="menuitemradio" data-theme-btn="noite"><i class="swatch sw-noite"></i>Céu noturno</button>
          <button type="button" role="menuitemradio" data-theme-btn="universo"><i class="swatch sw-universo"></i>Universo</button>
        </div>
      </div>

      <div class="popover-wrap">
        <button type="button" class="icon-btn lg" data-popover="data-pop" title="Dados" aria-label="Opções de dados" aria-expanded="false">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
        </button>
        <div class="popover" id="data-pop" role="menu" hidden>
          <div class="popover-title">Seus dados</div>
          <button type="button" role="menuitem" id="export-btn">
            <svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"/></svg>Exportar backup
          </button>
          <label role="menuitem" class="as-button">
            <svg viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 20h14"/></svg>Importar backup
            <input type="file" id="import-input" accept="application/json,.json" hidden>
          </label>
          <p class="popover-note">Tudo fica salvo automaticamente neste navegador.</p>
        </div>
      </div>

      <button type="button" class="btn primary new-task-btn" data-act="new" title="Nova tarefa (N)">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Nova tarefa</span>
      </button>
    </div>
  </header>

  <!-- Barra de pesquisa: só aparece com o botão de busca ativo -->
  <div class="search-bar" id="search-bar" hidden>
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
    <input id="search" type="search" placeholder="Pesquisar tarefas ou #tags" aria-label="Pesquisar">
    <button type="button" class="icon-btn" id="search-close" aria-label="Fechar pesquisa">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <main class="layout" data-view="list">
    <!-- ============ Lista de tarefas ============ -->
    <section class="panel tasks-panel" aria-label="Tarefas">
      <div class="list-toolbar">
        <div class="segmented" aria-label="Filtro">
          <button type="button" data-filter="all" class="active">Todas</button>
          <button type="button" data-filter="pending">Pendentes</button>
          <button type="button" data-filter="done">Feitas</button>
        </div>
        <select id="list-sort" class="input small" aria-label="Ordenar por">
          <option value="urgency">Urgência</option>
          <option value="date">Data</option>
          <option value="created">Recentes</option>
        </select>
      </div>
      <ul id="task-list" class="task-list"></ul>
      <div id="stats" class="stats"></div>
    </section>

    <!-- ============ Grafo ============ -->
    <section class="panel graph-panel" aria-label="Visualização de grafo">
      <div class="graph-stage" id="graph-stage">
        <canvas id="graph"></canvas>
        <!-- Card lateral de exibição (minimizável) -->
        <aside class="graph-settings minimized" id="graph-settings">
          <button type="button" class="gs-head" id="gs-toggle" aria-expanded="false" aria-controls="gs-content" title="Mostrar/minimizar opções de exibição">
            <svg viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M20 18h0"/><circle cx="16" cy="6" r="2.2"/><circle cx="10" cy="12" r="2.2"/><circle cx="18" cy="18" r="2.2"/></svg>
            <span>Exibição</span>
            <svg class="gs-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="gs-content" id="gs-content"></div>
        </aside>
        <button type="button" id="fit-btn" class="icon-btn floating" title="Centralizar grafo" aria-label="Centralizar grafo">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <div class="graph-tooltip" id="graph-tooltip" hidden></div>
        <div class="graph-empty" id="graph-empty" hidden>
          <svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="6" r="1.8"/><circle cx="12" cy="17" r="2.6"/><path d="M8 7.5l8-1M7 9l4 6M17 8l-4 7" stroke-dasharray="2 2"/></svg>
          <span id="graph-empty-text">Suas tarefas aparecerão aqui como um grafo</span>
        </div>
      </div>
    </section>
  </main>

  <!-- Navegação inferior (telas pequenas) -->
  <nav class="bottom-nav" aria-label="Alternar visualização">
    <button type="button" data-view-btn="list" class="active">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>
      <span>Tarefas</span>
    </button>
    <button type="button" data-view-btn="graph">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="6" r="1.8"/><circle cx="12" cy="17" r="2.6"/><path d="M8 7.5l8-1M7 9l4 6M17 8l-4 7"/></svg>
      <span>Grafo</span>
    </button>
  </nav>

  <!-- ============ Modal: criar / editar tarefa ============ -->
  <dialog id="task-modal" class="modal" aria-labelledby="form-title">
    <form id="task-form" class="task-form" autocomplete="off">
      <div class="modal-head">
        <h2 id="form-title">Nova tarefa</h2>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span class="field-label">Título</span>
          <input id="f-title" class="input" required maxlength="80" placeholder="Ex.: Pagar a conta de luz">
        </label>
        <label class="field">
          <span class="field-label">Descrição <small>opcional</small></span>
          <textarea id="f-desc" class="input" maxlength="280" rows="3" placeholder="Detalhes curtos. Dica: #tag agrupa e [[Outra tarefa]] conecta."></textarea>
        </label>
        <div class="form-row">
          <label class="field">
            <span class="field-label">Data</span>
            <input type="date" id="f-date" class="input">
          </label>
          <label class="field">
            <span class="field-label">Urgência <output id="f-urg-out" class="urg-out">0.50</output></span>
            <input type="range" id="f-urg" class="urg-range" min="0" max="1" step="0.05" value="0.5">
          </label>
        </div>
        <div class="field" id="links-field">
          <span class="field-label">Conexões <small>opcional</small></span>
          <div class="links-picker">
            <div id="f-links" class="chips"></div>
            <select id="f-link-select" class="input"><option value="">+ Conectar a uma tarefa…</option></select>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn ghost danger-text" id="delete-in-modal" hidden>Excluir</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>Cancelar</button>
        <button type="submit" class="btn primary" id="submit-btn">Adicionar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js?v=8"></script>
</body>
</html>
